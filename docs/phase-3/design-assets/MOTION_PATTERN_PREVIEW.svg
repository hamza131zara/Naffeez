<text x="64" y="906" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#C2C2C2" text-anchor="start">PLACEMENT CANDIDATES — PROPOSED, NOT FINAL</text>
<rect x="64" y="925" width="510" height="130" rx="10" fill="#202020" stroke="#404040" stroke-width="1"/><text x="84" y="954" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#F5F5F5" text-anchor="start">STYLE 01  /  TEXT REVEAL</text><text x="84" y="984" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="400" fill="#C2C2C2" text-anchor="start">Homepage section headings + short supporting copy</text><text x="84" y="1008" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="400" fill="#C2C2C2" text-anchor="start">New Arrivals · Category intro · Journal teaser</text><text x="84" y="1032" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="400" fill="#A3A3A3" text-anchor="start">Subtle, reversible, no per-word split by default</text>
<rect x="600" y="925" width="510" height="130" rx="10" fill="#202020" stroke="#404040" stroke-width="1"/><text x="620" y="954" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#F5F5F5" text-anchor="start">STYLE 02  /  CIRCULAR IMAGE REVEAL</text><text x="620" y="984" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="400" fill="#C2C2C2" text-anchor="start">Homepage Product Studio feature / selected Journal cover</text><text x="620" y="1008" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="400" fill="#C2C2C2" text-anchor="start">One or two large editorial images only</text><text x="620" y="1032" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="400" fill="#A3A3A3" text-anchor="start">No hero video, product cards or gallery zoom overlap</text>
<rect x="1136" y="925" width="550" height="130" rx="10" fill="#202020" stroke="#404040" stroke-width="1"/><text x="1156" y="954" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#F5F5F5" text-anchor="start">DO NOT ADOPT FROM ONDA</text><text x="1156" y="984" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="400" fill="#C2C2C2" text-anchor="start">Pinned horizontal work track · rotating client wheel</text><text x="1156" y="1008" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="400" fill="#C2C2C2" text-anchor="start">Sticky card pile · large cross-section photo flight</text><text x="1156" y="1032" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="400" fill="#A3A3A3" text-anchor="start">Too intrusive for fast product browsing and checkout</text>
