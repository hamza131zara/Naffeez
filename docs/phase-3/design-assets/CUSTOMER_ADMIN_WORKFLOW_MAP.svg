<text x="406" y="529" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#777" text-anchor="start">→</text><rect x="448" y="473" width="330" height="100" rx="12" fill="#FFFFFF" stroke="#D2D2D2" stroke-width="1"/><text x="468" y="503" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#111" text-anchor="start">Customer submits reference / proof</text><text x="468" y="529" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#555" text-anchor="start">Payment state = pending_verification</text><text x="468" y="551" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#555" text-anchor="start">Proof is private; customer can see status</text>
