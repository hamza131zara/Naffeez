<text x="1210" y="529" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#777" text-anchor="start">→</text><rect x="1252" y="473" width="450" height="100" rx="12" fill="#FFFFFF" stroke="#D2D2D2" stroke-width="1"/><text x="1272" y="503" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#111" text-anchor="start">Verified / Rejected / More proof</text><text x="1272" y="529" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#555" text-anchor="start">Only a verified receipt changes payment status</text><text x="1272" y="551" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#555" text-anchor="start">Customer inbox/email receives transactional update</text>
<rect x="52" y="610" width="1650" height="56" rx="12" fill="#121212" stroke="none" stroke-width="1"/><text x="78" y="634" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700" fill="#C2C2C2" text-anchor="start">GLOBAL GUARDRAILS</text><text x="250" y="634" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="500" fill="#F5F5F5" text-anchor="start">Server recalculates totals and stock  ·  Invoice snapshot remains immutable  ·  Customer data is owner-scoped  ·  Marketing requires explicit opt-in  ·  Email/3D failure must not block core order</text>
