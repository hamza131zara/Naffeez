<text x="406" y="352" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#777" text-anchor="start">→</text><rect x="448" y="296" width="330" height="100" rx="12" fill="#FFFFFF" stroke="#D2D2D2" stroke-width="1"/><text x="468" y="326" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#111" text-anchor="start">Admin fulfills order</text><text x="468" y="352" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#555" text-anchor="start">Processing → shipped → delivered</text><text x="468" y="374" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#555" text-anchor="start">COD collection recorded by staff</text>
